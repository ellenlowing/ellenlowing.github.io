<!--
  Band layout (viewBox units)
    top0     32   top of the drip cap == the tracked keypoint sits here
    capEnd  136   end of fixed top band
    bodyEnd 210   end of the STRETCHABLE band (vertical detail only!)
    bot0    242   body bottom == meets the next tier's top0
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 270" width="390" height="270">
  <defs>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#2A1408" stop-opacity="0.30"/>
      <stop offset="0.16" stop-color="#2A1408" stop-opacity="0.06"/>
      <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.56" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.82" stop-color="#2A1408" stop-opacity="0.08"/>
      <stop offset="1.00" stop-color="#2A1408" stop-opacity="0.28"/>
    </linearGradient>

    <pattern id="pipe" width="29" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="14" height="20" fill="#FF9FC0"/>
    </pattern>

    <pattern id="pearl" width="29" height="32" patternUnits="userSpaceOnUse" x="2">
      <circle cx="14.5" cy="16" r="11.5" fill="#FFF8EE" stroke="#4A2C17" stroke-width="4.5"/>
    </pattern>

    <clipPath id="body">
      <rect x="34" y="48" width="322" height="194" rx="15"/>
    </clipPath>
  </defs>

  <g stroke="#4A2C17" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== tier body ===== -->
    <rect x="34" y="48" width="322" height="194" rx="15" fill="#FFC2D6"/>
    <g clip-path="url(#body)" stroke="none">
      <rect x="34" y="48" width="322" height="194" fill="url(#pipe)"/>
      <rect x="34" y="48" width="322" height="194" fill="url(#cyl)"/>
    </g>
    <rect x="34" y="48" width="322" height="194" rx="15" fill="none"/>

    <!-- ===== white drip cap (top0 = 32) ===== -->
    <path fill="#FFF8EE" d="
      M 24,52 Q 24,32 44,32
      H 346 Q 366,32 366,52
      V 86
      C 366,86 354,86 346,86
      C 346,118 310,118 310,86
      H 276
      C 276,108 248,108 248,86
      H 214
      C 214,126 170,126 170,86
      H 138
      C 138,106 112,106 112,86
      H 78
      C 78,120 36,120 36,86
      H 24
      Z"/>
    <path d="M 50,50 H 152" stroke="#FFFFFF" stroke-width="9" opacity="0.85"/>

    <g stroke="none">
      <rect x="68"  y="48" width="19" height="7" rx="3.5" fill="#6C8CFF" transform="rotate(28 77 51)"/>
      <rect x="124" y="58" width="19" height="7" rx="3.5" fill="#FFC93C" transform="rotate(-14 133 61)"/>
      <rect x="180" y="46" width="19" height="7" rx="3.5" fill="#9B5DE5" transform="rotate(36 189 49)"/>
      <rect x="236" y="59" width="19" height="7" rx="3.5" fill="#3FC98A" transform="rotate(-26 245 62)"/>
      <rect x="294" y="47" width="19" height="7" rx="3.5" fill="#FF6B9D" transform="rotate(10 303 50)"/>
    </g>

    <!-- ===== pearl border (band C) ===== -->
    <g clip-path="url(#body)" stroke="none">
      <rect x="34" y="210" width="322" height="32" fill="url(#pearl)"/>
    </g>
  </g>
</svg>
