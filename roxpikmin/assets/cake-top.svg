<!--
  Band layout (viewBox units)
    top0    150   top of the drip cap == the tracked keypoint sits here
    capEnd  248   end of fixed top band (candles live ABOVE top0)
    bodyEnd 300   end of the STRETCHABLE band (vertical detail only!)
    bot0    328   body bottom == meets the next tier's top0
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" width="340" height="340">
  <defs>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#2A1408" stop-opacity="0.30"/>
      <stop offset="0.16" stop-color="#2A1408" stop-opacity="0.06"/>
      <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.56" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.82" stop-color="#2A1408" stop-opacity="0.08"/>
      <stop offset="1.00" stop-color="#2A1408" stop-opacity="0.28"/>
    </linearGradient>

    <pattern id="pipe" width="27" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="13" height="20" fill="#FFD173"/>
    </pattern>

    <pattern id="pearl" width="27" height="30" patternUnits="userSpaceOnUse" x="2">
      <circle cx="13.5" cy="15" r="10.5" fill="#FFF8EE" stroke="#4A2C17" stroke-width="4.5"/>
    </pattern>

    <clipPath id="body">
      <rect x="42" y="166" width="256" height="162" rx="14"/>
    </clipPath>

    <radialGradient id="glow">
      <stop offset="0"   stop-color="#FFD166" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="#4A2C17" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== candles (drawn first so the cap hides their bases) ===== -->
    <g>
      <circle cx="99"  cy="60" r="46" fill="url(#glow)" stroke="none"/>
      <circle cx="170" cy="42" r="50" fill="url(#glow)" stroke="none"/>
      <circle cx="241" cy="60" r="46" fill="url(#glow)" stroke="none"/>

      <!-- left -->
      <rect x="86" y="92" width="26" height="66" rx="7" fill="#FF8FA3"/>
      <path d="M 86,112 H 112 M 86,134 H 112" stroke-width="4"/>
      <path d="M 99,84 V 94" stroke-width="4"/>
      <path d="M 99,44 C 118,64 113,84 99,84 C 85,84 80,64 99,44 Z" fill="#FFC93C"/>
      <path d="M 99,60 C 107,70 105,79 99,79 C 93,79 91,70 99,60 Z" fill="#FF7A3D" stroke="none"/>

      <!-- middle (tallest) -->
      <rect x="157" y="74" width="26" height="84" rx="7" fill="#8FD9FF"/>
      <path d="M 157,98 H 183 M 157,124 H 183" stroke-width="4"/>
      <path d="M 170,66 V 76" stroke-width="4"/>
      <path d="M 170,24 C 189,44 184,66 170,66 C 156,66 151,44 170,24 Z" fill="#FFC93C"/>
      <path d="M 170,42 C 178,52 176,61 170,61 C 164,61 162,52 170,42 Z" fill="#FF7A3D" stroke="none"/>

      <!-- right -->
      <rect x="228" y="92" width="26" height="66" rx="7" fill="#B9F0C9"/>
      <path d="M 228,112 H 254 M 228,134 H 254" stroke-width="4"/>
      <path d="M 241,84 V 94" stroke-width="4"/>
      <path d="M 241,44 C 260,64 255,84 241,84 C 227,84 222,64 241,44 Z" fill="#FFC93C"/>
      <path d="M 241,60 C 249,70 247,79 241,79 C 235,79 233,70 241,60 Z" fill="#FF7A3D" stroke="none"/>
    </g>

    <!-- ===== tier body ===== -->
    <rect x="42" y="166" width="256" height="162" rx="14" fill="#FFE3A0"/>
    <g clip-path="url(#body)" stroke="none">
      <rect x="42" y="166" width="256" height="162" fill="url(#pipe)"/>
      <rect x="42" y="166" width="256" height="162" fill="url(#cyl)"/>
    </g>
    <rect x="42" y="166" width="256" height="162" rx="14" fill="none"/>

    <!-- ===== white drip cap (top0 = 150) ===== -->
    <path fill="#FFF8EE" d="
      M 32,170 Q 32,150 52,150
      H 288 Q 308,150 308,170
      V 200
      C 308,200 296,200 288,200
      C 288,230 254,230 254,200
      H 222
      C 222,222 196,222 196,200
      H 164
      C 164,238 124,238 124,200
      H 94
      C 94,220 70,220 70,200
      H 32
      Z"/>
    <path d="M 56,168 H 140" stroke="#FFFFFF" stroke-width="9" opacity="0.85"/>

    <g stroke="none">
      <rect x="64"  y="166" width="18" height="7" rx="3.5" fill="#FF6B9D" transform="rotate(-22 73 169)"/>
      <rect x="120" y="176" width="18" height="7" rx="3.5" fill="#6C8CFF" transform="rotate(30 129 179)"/>
      <rect x="178" y="164" width="18" height="7" rx="3.5" fill="#9B5DE5" transform="rotate(-6 187 167)"/>
      <rect x="236" y="177" width="18" height="7" rx="3.5" fill="#3FC98A" transform="rotate(18 245 180)"/>
    </g>

    <!-- ===== pearl border (band C) ===== -->
    <g clip-path="url(#body)" stroke="none">
      <rect x="42" y="300" width="256" height="28" fill="url(#pearl)"/>
    </g>
  </g>
</svg>
